<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>OPENTERM — Market Terminal</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'&gt;&lt;rect width='16' height='16' fill='black'/&gt;&lt;text x='1.5' y='12' font-size='11' fill='%23ff7a00' font-family='monospace' font-weight='bold'&gt;OT&lt;/text&gt;&lt;/svg&gt;">
</head>
<body>
  <div id="terminal">

    <!-- top brand bar -->
    <div id="topbar">
      <span id="brand"><span class="brand-mark">OPEN</span><span class="brand-mark2">TERM</span></span>
      <span id="mkt-status"><span class="dot"></span><span id="mkt-status-text">MARKET</span></span>
      <span id="topbar-spacer"></span>
      <span id="top-tabs">
        <button class="top-tab" data-cmd="HOME">HOME</button>
        <button class="top-tab" data-cmd="WEI">WEI</button>
        <button class="top-tab" data-cmd="MOST">MOST</button>
        <button class="top-tab" data-cmd="TOP">TOP</button>
        <button class="top-tab" data-cmd="W">W</button>
      </span>
      <span id="clock"></span>
    </div>

    <!-- command bar -->
    <div id="cmdbar">
      <span id="cmd-caret">&gt;</span>
      <input id="cmd" type="text" autocomplete="off" autocapitalize="characters"
             spellcheck="false" enterkeyhint="go"
             placeholder="Enter command  (e.g. AAPL GP · MSFT DES · NVDA FA · WEI · MOST · CRYP · HELP)">
      <button id="go-btn">GO</button>
      <button id="help-btn" data-cmd="HELP">HELP</button>
    </div>
    <div id="cmd-msg"></div>
    <div id="autocomplete" class="hidden"></div>

    <!-- scrolling index tape -->
    <div id="tape-outer"><div id="tape"></div></div>

    <!-- security header (per-security functions) -->
    <div id="sec-header" class="hidden">
      <div id="sec-line1">
        <span id="sec-symbol"></span>
        <span id="sec-name"></span>
        <span id="sec-exch"></span>
        <span id="sec-price"></span>
        <span id="sec-change"></span>
        <span id="sec-time"></span>
      </div>
      <div id="sec-funcs"></div>
    </div>

    <!-- main function view -->
    <div id="view"></div>

    <!-- Bloomberg-style colored function-key legend -->
    <div id="keybar"></div>

    <!-- status / news ticker line -->
    <div id="statusline">
      <span id="status-left">OPENTERM</span>
      <span id="news-ticker-wrap"><span id="news-ticker"></span></span>
      <span id="status-right"></span>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
